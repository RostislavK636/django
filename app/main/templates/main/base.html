{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
  </head>
  <body>
    <header>
      <h1>Платформа обучения</h1>
      <nav>
        <a href="{% url 'main:index' %}">Главная</a>
        <a href="{% url 'main:courses' %}">Курсы</a>
        <a href="{% url 'main:deleted_course' %}">Удалённые курсы</a>
        {% if user.is_authenticated %} <p> Вы вошли как {{user.username}} </p> 
        <form action="{% url "main:logout"%}" method='post'>
          {%csrf_token%}
          <button type='submit'>Выйти</button>
        </form>
        {% else %}
        <a href="{%url 'main:login'%}"> Войти </a>
        {% endif %}
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>Платформа обучения</p>
    </footer>
  </body>
</html>
