{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
  </head>
  <body>
    <header>
      <h1>{% block header %}Платформа обучения{% endblock %}</h1>
      <nav>
        <a href="{% url 'main:index' %}">Главная</a>
        <a href="{% url 'main:course' %}">Курсы</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <p>Платформа обучения</p>
    </footer>
  </body>
</html>
