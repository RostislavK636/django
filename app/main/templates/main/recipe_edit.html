{% extends "main/base.html" %}
{% block title %}Изменить Рецепт{% endblock  %}
{% block content %}
<form method='post'>
    {% csrf_token %}
    <p>Название {{form.name}}</p>
    {{form.name.errors}}
    <p>Категория {{form.Category}}</p>
    {{form.Category.errors}}

    <button type='submit'>Изменить</button>
</form>
{% endblock  %}
