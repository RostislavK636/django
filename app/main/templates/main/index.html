{%load static%}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
    </header>

    <main>
      <section>
        <h2>Добро пожаловать!</h2>
        <p>Учитесь программированию и создавайте свои первые проекты.</p>
      </section>

      <section>
        <h2>Курсы</h2>
        <p>Выберите курс, чтобы начать обучение.</p>
        {% if not course %}
        <p class="empty-state">Курсов пока нет</p>
        {% endif %}
      </section>
    </main>

    <footer>
      <p>Платформа обучения</p>
    </footer>
  </body>
</html>
